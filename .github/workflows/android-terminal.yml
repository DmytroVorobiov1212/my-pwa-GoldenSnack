name: Android Production Terminal

on:
  workflow_dispatch:
  push:
    branches:
      - android-production-terminal-v1
    paths:
      - 'android-terminal/**'
      - '.github/workflows/android-terminal.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-terminal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD is missing" && exit 1)

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/goldensnack-terminal.jks
          test -s app/goldensnack-terminal.jks

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: goldensnack-terminal.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Prepare provisioning package
        run: |
          rm -rf dist
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GoldenSnack-Terminal.apk
          cp SETUP-GOLDENSNACK-TABLET.bat dist/SETUP-GOLDENSNACK-TABLET.bat

      - name: Upload signed terminal package
        uses: actions/upload-artifact@v4
        with:
          name: GoldenSnack-Terminal
          path: android-terminal/dist/
          if-no-files-found: error
          retention-days: 30
