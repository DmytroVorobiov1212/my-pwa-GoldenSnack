name: Android Production Terminal

on:
  workflow_dispatch:
  push:
    branches:
      - android-production-terminal-v1
    paths:
      - 'android-terminal/**'
      - '.github/workflows/android-terminal.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-terminal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: golden-snack-production-terminal-debug
          path: android-terminal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
