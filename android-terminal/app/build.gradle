plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.goldensnack.productionterminal'
    compileSdk 35

    defaultConfig {
        applicationId 'cz.goldensnack.productionterminal'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
